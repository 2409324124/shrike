name: Feature request
description: Suggest something Shrike should do
labels: [enhancement, needs-triage]
body:
  - type: markdown
    attributes:
      value: For open-ended ideas, start a thread in [Discussions → Ideas](https://github.com/SumantxD/shrike/discussions/categories/ideas) first.
  - type: textarea
    id: problem
    attributes:
      label: The problem
      description: What were you trying to do, and what got in the way?
      placeholder: When my app calls three services, I can't tell which one was slow.
    validations:
      required: true
  - type: textarea
    id: idea
    attributes:
      label: What you'd like
      description: How you picture it working. Screenshots or sketches help.
    validations:
      required: true
  - type: textarea
    id: alternatives
    attributes:
      label: What you do today instead
  - type: checkboxes
    id: help
    attributes:
      label: Contributing
      options:
        - label: I'd like to work on this myself
