name: Release

# Pushing a tag like v0.2.0 builds the Linux packages and opens a draft release with that version's CHANGELOG section.
# The maintainer adds the signed, notarised macOS .dmg from scripts/release/build-mac.sh, then publishes (docs/RELEASING.md).
on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - name: Check the tag matches the app version
        run: test "v$(node -p "require('./apps/desktop/package.json').version")" = "$GITHUB_REF_NAME"
      - run: scripts/release/build-linux.sh x64 "AppImage deb"
      - name: Draft the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          v="${GITHUB_REF_NAME#v}"
          awk -v v="$v" '$0 ~ "^## \\[" v "\\]" {on=1; next} on && /^(## )?\[/ {exit} on' CHANGELOG.md > notes.md
          test -s notes.md || { echo "CHANGELOG.md has no section for $v"; exit 1; }
          gh release create "$GITHUB_REF_NAME" --draft --title "Shrike $v" --notes-file notes.md release/dist/*.AppImage release/dist/*.deb
