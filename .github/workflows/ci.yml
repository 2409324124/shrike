name: CI

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read

jobs:
  check:
    strategy:
      fail-fast: false
      matrix:
        os: [macos-14, ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        shell: bash
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: pnpm typecheck
      - name: Test
        if: runner.os == 'macOS'
        run: pnpm test
      # Linux: the Electron tests need a display, and Ubuntu 24.04's AppArmor blocks Electron's sandbox without this.
      - name: Test (Linux)
        if: runner.os == 'Linux'
        run: |
          sudo sysctl -w kernel.apparmor_restrict_unprivileged_userns=0
          xvfb-run -a pnpm test
      # Windows: the full suite still assumes a POSIX shell, process groups and "/" paths, so only the platform layer
      # and the pure packages gate the build. The rest runs for information until it is green there.
      - name: Test (Windows gate)
        if: runner.os == 'Windows'
        run: node --test --experimental-test-isolation=none apps/desktop/src/main/platform.test.ts packages/redact/test/redact.test.ts 'packages/correlator/test/*.test.ts'
      - name: Test (Windows, full suite, not gating)
        if: runner.os == 'Windows'
        continue-on-error: true
        run: node --test --experimental-test-isolation=none 'packages/*/test/*.test.ts' 'packages/*/test/*.test.mjs' 'apps/desktop/src/**/*.test.ts'

  linux-package:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0
        with:
          version: 10.34.6
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: pnpm
      - run: pnpm install --frozen-lockfile
      - run: scripts/release/build-linux.sh x64 "AppImage deb"
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: shrike-linux-x64
          path: |
            release/dist/*.AppImage
            release/dist/*.deb
          if-no-files-found: error
