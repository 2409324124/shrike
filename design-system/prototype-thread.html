<title>Shrike Thread</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=JetBrains+Mono:wght@400;500;600&family=Space+Grotesk:wght@300;400;500;600;700&display=swap">
<style>
:root{
  color-scheme:dark;
  --void:#02040A;--abyss:#060B18;--navy:#0A1633;--glass:rgba(120,170,255,.07);--glass-edge:rgba(180,215,255,.26);--hair:rgba(160,205,255,.12);
  --ink:#EAF2FF;--ink-dim:#7D8CA8;--ink-faint:#3A4763;--core:#F6FBFF;
  --cyan:#3FE7FF;--blue:#2F7BFF;--violet:#8B5CF6;--magenta:#C06BFF;--teal:#2DD4BF;--amber:#FF9A3C;--ok:#38F2A0;--slow:#FFC15C;--fail:#FF3B4E;
  --display:"Space Grotesk",system-ui,sans-serif;--mono:"JetBrains Mono",ui-monospace,Menlo,monospace;
  --ease:cubic-bezier(.65,0,.35,1);--out:cubic-bezier(.16,1,.3,1);
}
*{box-sizing:border-box}
html,body{height:100%;margin:0;background:var(--void);color:var(--ink);font:400 14px/1.5 var(--display);overflow:hidden}
.app{height:100%;display:grid;grid-template-rows:44px 1fr;padding-inline:12px;padding-block:0 12px;
  background:radial-gradient(ellipse 70% 60% at 55% 30%,#081430 0%,var(--void) 70%)}
.top{display:flex;align-items:center;gap:14px;border-bottom:1px solid var(--hair);padding-inline:6px}
.wm{font:600 12px var(--mono);letter-spacing:.5em}.wm b{color:var(--cyan);font-weight:600}
.lbl{font:500 10.5px var(--mono);letter-spacing:.16em;text-transform:uppercase;color:var(--ink-dim)}
.livestat{display:inline-flex;align-items:center;gap:6px}.livestat i{width:7px;height:7px;border-radius:50%;background:var(--ok);box-shadow:0 0 10px var(--ok)}
.sp{flex:1}
.btn{font:500 11px var(--mono);letter-spacing:.12em;text-transform:uppercase;color:var(--ink);background:var(--glass);border:1px solid var(--hair);border-radius:8px;padding:6px 10px;cursor:pointer}
.btn:hover{border-color:var(--glass-edge)}
.btn.on{border-color:var(--cyan);color:var(--cyan)}
.btn:focus-visible,.station:focus-visible{outline:2px solid var(--cyan);outline-offset:2px}
.body{display:grid;grid-template-columns:minmax(220px,24%) 1fr 34px;gap:12px;min-height:0;padding-top:12px}
@media (max-width:820px){.body{grid-template-columns:1fr 28px}.dock{display:none}}
/* app dock: a mock of the user's running app */
.dock{border:1px solid var(--hair);border-radius:14px;overflow:hidden;display:grid;grid-template-rows:28px 1fr;background:#0B0F17}
.dock .bar{display:flex;align-items:center;gap:8px;padding-inline:10px;border-bottom:1px solid var(--hair)}
.mock{background:#F4F6FA;color:#141821;padding:16px;font:400 13px system-ui;overflow:auto}
.mock h3{margin:0 0 2px;font:700 18px system-ui}.mock p{margin:0 0 12px;color:#5b6475;font-size:12px}
.mock .row{display:flex;gap:6px;margin-bottom:6px}
.mock input{flex:1;min-width:0;padding:8px;border:1px solid #cfd5df;border-radius:7px;font:inherit}
.mock button{padding:8px 12px;border:0;border-radius:7px;background:#3B5BDB;color:#fff;font:600 12px system-ui;cursor:pointer}
.mock .err{color:#d33;font-size:12px;min-height:18px}
.mock ul{list-style:none;padding:0;margin:8px 0 0}.mock li{display:flex;gap:8px;align-items:center;padding:7px 0;border-bottom:1px solid #e3e7ee;font-size:12.5px}
.mock li small{margin-left:auto;color:#7a8394}
/* feed */
.stage{position:relative;min-height:0;border:1px solid var(--hair);border-radius:16px;overflow:hidden;background:linear-gradient(180deg,rgba(6,11,24,.6),rgba(2,4,10,.9))}
.lanes{position:absolute;inset:0;pointer-events:none}
.lane{position:absolute;top:0;bottom:0;width:1px;background:linear-gradient(180deg,transparent,rgba(160,205,255,.16) 12%,rgba(160,205,255,.16) 88%,transparent)}
.lane::after{content:"";position:absolute;left:-14px;width:29px;top:0;bottom:0;background:linear-gradient(90deg,transparent,rgba(63,231,255,.035),transparent)}
.lanehead{position:absolute;top:0;left:0;right:0;height:46px;z-index:5;background:linear-gradient(180deg,rgba(3,6,14,1) 0,rgba(3,6,14,.92) 60%,rgba(3,6,14,0));pointer-events:none}
.lanehead span{position:absolute;top:11px;transform:translateX(-50%);font:600 10px var(--mono);letter-spacing:.24em;color:var(--ink-dim)}
.lanehead span.hot{color:var(--ink)}
.feed{position:absolute;inset:0;overflow-y:auto;overflow-x:hidden;scroll-behavior:smooth;scrollbar-width:none}
.feed::-webkit-scrollbar{display:none}
.trip{position:relative;transition:opacity .4s var(--ease),filter .4s var(--ease)}
.trip.recede{opacity:.32;filter:blur(.6px) saturate(.6)}
.trip svg{position:absolute;left:0;top:0;overflow:visible;pointer-events:none}
.triphead{position:absolute;left:16px;right:16px;display:flex;align-items:baseline;gap:10px}
.triphead .t{font:500 15px var(--display)}
.verdict{font:500 10px var(--mono);letter-spacing:.14em;padding:2px 7px;border-radius:5px;border:1px solid}
.verdict.ok{color:var(--ok);border-color:rgba(56,242,160,.4)}.verdict.error{color:var(--fail);border-color:rgba(255,59,78,.5);box-shadow:0 0 14px rgba(255,59,78,.25)}
.station{position:absolute;transform:translate(-50%,-50%);width:14px;height:14px;border-radius:50%;background:var(--abyss);border:2px solid var(--cyan);cursor:pointer;z-index:3;transition:transform .25s var(--out),box-shadow .25s}
.station.error{border-color:var(--fail);background:#2a0610}
.station.slow{border-color:var(--slow)}
.station.focus{transform:translate(-50%,-50%) scale(1.35);box-shadow:0 0 0 4px rgba(63,231,255,.15),0 0 22px var(--cyan)}
.station.error.focus{box-shadow:0 0 0 4px rgba(255,59,78,.18),0 0 26px var(--fail)}
.station.hidden{opacity:0;transform:translate(-50%,-50%) scale(.2)}
.slabel{position:absolute;transform:translateY(-50%);font:500 12.5px var(--mono);white-space:nowrap;pointer-events:none;z-index:3;transition:opacity .3s}
.slabel small{display:block;color:var(--ink-dim);font-size:10.5px;letter-spacing:.06em}
.slabel.left{transform:translate(-100%,-50%);text-align:right}
.chip{display:inline-block;margin-top:3px;padding:2px 7px;border-radius:5px;font:500 11px var(--mono);background:rgba(63,231,255,.08);border:1px solid rgba(63,231,255,.3);color:#BFF6FF}
.chip.error{background:rgba(255,59,78,.12);border-color:rgba(255,59,78,.45);color:#FFD3D8;box-shadow:0 0 16px rgba(255,59,78,.25)}
.coil{position:absolute;transform:translate(-50%,-50%);pointer-events:none;z-index:2}
.shot{position:absolute;transform:translate(-50%,-50%);width:118px;border-radius:9px;overflow:hidden;border:1px solid var(--glass-edge);background:#F4F6FA;color:#141821;font:500 9px system-ui;padding:7px;z-index:3;box-shadow:0 10px 30px -10px #000}
.shot b{display:block;font:700 10px system-ui;margin-bottom:4px}
.shot .btnm{display:inline-block;background:#3B5BDB;color:#fff;border-radius:4px;padding:2px 5px;position:relative}
.shot .ret{position:absolute;inset:-6px;border:1.5px solid var(--cyan);border-radius:6px;box-shadow:0 0 12px var(--cyan)}
.shot .e{color:#d33;margin-top:4px}
.shot .tag{position:absolute;top:-16px;left:0;font:500 9px var(--mono);letter-spacing:.14em;color:var(--ink-dim)}
.spark{position:absolute;width:3px;height:3px;border-radius:50%;background:#FFD3D8;box-shadow:0 0 8px var(--fail);z-index:4;pointer-events:none}
.probe{position:absolute;width:16px;height:16px;border-radius:50%;transform:translate(-50%,-50%);background:radial-gradient(circle,#fff,var(--violet) 55%,transparent 70%);box-shadow:0 0 24px var(--violet);z-index:6;transition:left .38s var(--ease),top .38s var(--ease);pointer-events:none}
.tick{position:absolute;transform:translate(-50%,-160%);font:600 11px var(--mono);color:var(--violet);z-index:4;pointer-events:none}
.found{position:absolute;transform:translate(-50%,-50%);width:54px;height:54px;z-index:5;pointer-events:none}
.found i{position:absolute;width:12px;height:12px;border:1.5px solid var(--fail)}
.found i:nth-child(1){left:0;top:0;border-right:0;border-bottom:0}.found i:nth-child(2){right:0;top:0;border-left:0;border-bottom:0}
.found i:nth-child(3){left:0;bottom:0;border-right:0;border-top:0}.found i:nth-child(4){right:0;bottom:0;border-left:0;border-top:0}
.found span{position:absolute;top:-18px;left:50%;transform:translateX(-50%);font:700 10px var(--mono);letter-spacing:.2em;color:var(--fail);white-space:nowrap}
/* dive card */
.dive{position:absolute;z-index:8;width:min(640px,72%);border-radius:16px;border:1px solid var(--glass-edge);
  background:linear-gradient(180deg,rgba(18,28,52,.92),rgba(8,14,30,.94));backdrop-filter:blur(14px);box-shadow:0 0 0 1px rgba(63,231,255,.08),0 40px 80px -30px #000,0 0 60px -20px rgba(63,231,255,.35);
  transform-origin:var(--ox,0) var(--oy,0);animation:divein .42s var(--out) both}
@keyframes divein{from{opacity:0;transform:scale(.12)}to{opacity:1;transform:none}}
.dive .head{display:flex;align-items:center;gap:8px;padding:10px 14px;border-bottom:1px solid var(--hair)}
.dive .head .dot{width:8px;height:8px;border-radius:50%;background:var(--ink-faint)}
.dive .head .f{margin-left:6px;font:600 11px var(--mono);letter-spacing:.12em;color:var(--ink)}
.dive .head .k{margin-left:auto}
.dive pre{margin:0;padding:10px 0 12px;font:400 13px/1.62 var(--mono);overflow-x:auto}
.ln{display:grid;grid-template-columns:46px 1fr;padding-right:16px;white-space:pre}
.ln i{font-style:normal;color:var(--ink-faint);text-align:right;padding-right:14px}
.ln.live{background:linear-gradient(90deg,rgba(63,231,255,.18),rgba(63,231,255,.03));box-shadow:inset 2px 0 0 var(--cyan)}
.ln.live.error{background:linear-gradient(90deg,rgba(255,59,78,.25),rgba(255,59,78,.04));box-shadow:inset 2px 0 0 var(--fail)}
.inl{grid-column:2;margin:2px 0 4px}
.kw{color:#C792FF}.fn{color:#7CC8FF}.st{color:#9EF0C0}.nu{color:#FFC98B}.cm{color:var(--ink-faint)}
.dive .why{padding:10px 14px;border-top:1px solid var(--hair);color:var(--ink-dim);font-size:13px}
.stage.dived .trip:not(.focus) {opacity:.15}
.stage.dived .lane{opacity:.35}
/* caption */
.caption{position:absolute;left:0;right:0;bottom:0;z-index:7;padding:18px 18px 14px;background:linear-gradient(0deg,rgba(2,4,10,.96),rgba(2,4,10,0));display:flex;align-items:flex-end;gap:12px;pointer-events:none}
.caption .c{font:500 18px/1.35 var(--display);max-width:64ch;text-wrap:balance}
.caption .c.error{color:#FFD3D8}
.caption .k{margin-left:auto;white-space:nowrap}
.hint{position:absolute;right:16px;bottom:44px;z-index:8;display:grid;gap:3px;justify-items:end;pointer-events:none}
.hint span{font:500 10px var(--mono);letter-spacing:.1em;color:var(--ink-faint)}
.hint b{color:var(--ink-dim);font-weight:500}
/* minimap */
.mini{display:flex;flex-direction:column;gap:6px;padding-top:6px;overflow:hidden}
.mini button{all:unset;cursor:pointer;display:block;border-radius:6px;padding:3px;border:1px solid transparent}
.mini button.on{border-color:var(--glass-edge);background:var(--glass)}
.mini button:focus-visible{outline:2px solid var(--cyan)}
/* ask */
.ask{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:20;width:min(560px,92%);display:none}
.ask.open{display:block}
.pill{display:flex;align-items:center;gap:10px;padding:12px 16px;border-radius:999px;border:1px solid rgba(139,92,246,.6);background:rgba(16,14,40,.92);box-shadow:0 0 30px rgba(139,92,246,.35)}
.pill input{flex:1;min-width:0;background:none;border:0;color:var(--ink);font:500 14px var(--display);outline:none}
.agentcard{position:absolute;z-index:9;width:min(420px,60%);border-radius:14px;border:1px solid rgba(139,92,246,.5);background:rgba(14,12,34,.94);backdrop-filter:blur(12px);padding:14px;box-shadow:0 0 40px -10px rgba(139,92,246,.6);animation:divein .35s var(--out) both}
.agentcard .h{display:flex;gap:8px;align-items:center;margin-bottom:6px}
.agentcard .conf{font:600 9.5px var(--mono);letter-spacing:.16em;color:var(--violet);border:1px solid rgba(139,92,246,.6);border-radius:4px;padding:1px 6px}
.agentcard p{margin:0 0 10px;font-size:13.5px}
.agentcard .btn{white-space:nowrap}
.diff{font:400 12px/1.6 var(--mono);border-radius:8px;overflow:hidden;border:1px solid var(--hair);margin-bottom:10px}
.diff div{padding:2px 10px;white-space:pre;overflow-x:auto}
.diff .d{background:rgba(255,59,78,.12);color:#FFC2C9}.diff .a{background:rgba(56,242,160,.10);color:#C4FFE3}
.row{display:flex;gap:8px}
/* ---- additions: projects, discovered lanes (D*), shapes T15–T20, agent A*, Orca O* ---- */
.top{position:relative}
.proj{background:none;border:0;padding:0;margin:0;cursor:pointer;position:relative}
.proj::after{content:"▾";position:absolute;left:100%;top:50%;transform:translateY(-50%);margin-left:2px;font-size:8px;opacity:0;transition:opacity .2s}
.proj:hover::after,.proj:focus-visible::after,.proj[aria-expanded="true"]::after{opacity:1}
.proj:focus-visible{outline:2px solid var(--cyan);outline-offset:3px}
.menu{position:absolute;top:40px;left:100px;z-index:40;width:320px;padding:6px;border-radius:12px;border:1px solid var(--glass-edge);background:#0A1022;box-shadow:0 30px 60px -20px #000;display:none}
.menu.open{display:block}
.menu button{all:unset;box-sizing:border-box;display:grid;grid-template-columns:auto 1fr auto;align-items:center;gap:2px 8px;width:100%;padding:8px 10px;border-radius:8px;cursor:pointer}
.menu button:hover,.menu button:focus-visible{background:var(--glass)}
.menu button[aria-current="true"] b{color:var(--cyan)}
.menu b{font:600 12px var(--mono);letter-spacing:.06em}
.menu small{grid-column:2/-1;color:var(--ink-dim);font:400 11.5px var(--display)}
.menu .kg{color:var(--ink-dim)}
.udot{width:7px;height:7px;border-radius:50%;background:var(--cyan);box-shadow:0 0 8px var(--cyan);flex:none;align-self:center}
.tele{font:500 10px var(--mono);letter-spacing:.14em;text-transform:uppercase;color:var(--ink-faint);white-space:nowrap}
.tele b{font-weight:500;color:var(--ink-dim)}.tele b.bad{color:#FF7A85}.tele b.ag{color:#C9B6FF}
.btn.quiet{border-color:transparent;background:none;color:var(--ink-faint)}
.btn.quiet:hover{color:var(--ink-dim)}
.btn.quiet.on{color:#C9B6FF;border-color:rgba(139,92,246,.5)}
#bAsk{position:relative}
.fuel{position:absolute;left:-4px;top:-4px;width:calc(100% + 8px);height:calc(100% + 8px);pointer-events:none;overflow:visible;display:none}
.fuel rect{x:1px;y:1px;width:calc(100% - 2px);height:calc(100% - 2px);rx:11px;fill:none;stroke-width:1.6}
.kg{width:11px;height:11px;flex:none;fill:none;stroke:currentColor;stroke-width:1.3;stroke-linecap:round;stroke-linejoin:round;vertical-align:-1px}
/* D10 accordion + D11 ghost lanes */
.lanehead span.lh{display:flex;flex-direction:column;align-items:center;gap:2px;white-space:nowrap}
.lanehead .lh .nm{display:inline-flex;align-items:center;gap:5px;font-weight:inherit}
.lanehead .lh small{font:500 9px var(--mono);letter-spacing:.08em;color:var(--ink-faint)}
.lanehead span.lh.sliver{writing-mode:vertical-rl;flex-direction:row;font-size:8.5px;letter-spacing:.2em;color:var(--ink-faint);top:12px}
.lanehead .lh.sliver .kg{width:9px;height:9px}
.lanehead .lh.ghost{opacity:.6}.lanehead .lh.ghost:not(.sliver) .nm{border:1px dashed var(--ink-faint);border-radius:5px;padding:0 5px}
.lanehead .pvt{font-style:normal;font:600 7.5px var(--mono);letter-spacing:.14em;color:#B89CFF}
.lane.sliver{opacity:.5}.lane.sliver::after,.lane.ghost::after{display:none}
.lane.ghost{background:repeating-linear-gradient(180deg,rgba(160,205,255,.22) 0 4px,transparent 4px 10px)}
/* T15 bounce (hit), T16 pass-through (miss → set) */
.station.hit{width:10px;height:10px;background:var(--ok);border-color:var(--ok);box-shadow:0 0 10px rgba(56,242,160,.7)}
.station.miss{border-color:var(--amber);background:var(--abyss)}
.station.set{width:10px;height:10px;background:var(--cyan);border-color:var(--cyan)}
.chip.hit{background:rgba(56,242,160,.08);border-color:rgba(56,242,160,.4);color:#C4FFE3}
.chip.miss{background:rgba(255,154,60,.08);border-color:rgba(255,154,60,.45);color:#FFD9B5}
/* T17 fork label, T18 handoff */
.forklbl{position:absolute;transform:translateY(-50%);font:500 8.5px var(--mono);letter-spacing:.16em;color:var(--ink-dim);text-transform:uppercase;white-space:nowrap;pointer-events:none;z-index:3}
.pv{font:600 9px var(--mono);letter-spacing:.16em;color:#C9B6FF;border:1px dashed rgba(139,92,246,.6);border-radius:5px;padding:1px 6px}
.from{font:400 12px var(--display);color:var(--ink-dim)}
/* T20 terminal card */
.shot.term{width:168px;background:#0B0F17;color:#C9D6EA;font:500 9px/1.5 var(--mono);border-color:var(--hair);white-space:pre-wrap;overflow-wrap:anywhere}
.shot.term .pr{color:var(--cyan)}.shot.term .bad{color:#FF7A85}.shot.term .ok{color:var(--ok)}.shot.term .dim{color:var(--ink-dim)}
/* A11 watched-by, A5 memory pin, O9 unread */
.watch{display:inline-flex;gap:4px;align-items:center;font:500 10px var(--mono);letter-spacing:.08em;color:var(--ink-dim)}
.watch .kg{color:var(--cyan)}
.pin{position:absolute;transform:translate(-50%,-50%);width:16px;height:16px;display:grid;place-items:center;color:#B89CFF;z-index:4;cursor:help;border-radius:50%;outline:none}
.pin .kg{width:12px;height:12px;fill:rgba(139,92,246,.35);filter:drop-shadow(0 0 4px var(--violet))}
.pin::after{content:attr(data-note);position:absolute;left:18px;top:-2px;white-space:nowrap;font:500 11px var(--mono);padding:3px 8px;border-radius:6px;border:1px solid rgba(139,92,246,.6);background:rgba(16,14,40,.96);color:#E2D6FF;opacity:0;transition:opacity .2s;pointer-events:none}
.pin:hover::after,.pin:focus::after{opacity:1}
.mini button{position:relative}
.mini .ud{position:absolute;top:2px;right:2px;width:6px;height:6px;border-radius:50%;background:var(--cyan);box-shadow:0 0 6px var(--cyan)}
.mini .cp{position:absolute;right:1px;bottom:2px;width:7px;height:7px;transform:rotate(45deg);background:var(--violet);box-shadow:0 0 8px var(--violet);cursor:pointer}
.mini .cp.rw{background:none;border:1px solid var(--violet);box-shadow:none}
/* A1 planned route, A2/A4 agent status */
.plan{fill:none;stroke:#B89CFF;stroke-width:2;stroke-dasharray:1 7;stroke-linecap:round;opacity:.85}
.agentstat{position:absolute;top:52px;right:14px;z-index:9;display:none;align-items:center;gap:8px;padding:4px 10px;border-radius:999px;border:1px solid rgba(139,92,246,.5);background:rgba(16,14,40,.92);font:500 10.5px var(--mono);letter-spacing:.06em;color:#E2D6FF}
.agentstat.on{display:flex}
.agentstat i{width:5px;height:5px;border-radius:50%;background:var(--ink-faint)}.agentstat i.on{background:var(--violet);box-shadow:0 0 6px var(--violet)}
.skills{display:flex;gap:6px;flex-wrap:wrap;justify-content:center;margin-top:8px}
.skill{font:500 10.5px var(--mono);padding:3px 9px;border-radius:999px;border:1px solid var(--hair);color:var(--ink-dim);background:rgba(10,14,30,.9)}
.skill.lit{border-color:rgba(139,92,246,.7);color:#E2D6FF;box-shadow:0 0 12px rgba(139,92,246,.45)}
.ctx{font:500 10.5px var(--mono);padding:2px 8px;border-radius:6px;border:1px solid rgba(63,231,255,.4);color:#BFF6FF;white-space:nowrap;display:none}
/* A10 slash palette, O5 quick open */
.pal{margin-top:8px;border-radius:12px;border:1px solid rgba(139,92,246,.45);background:#0E0C22;padding:4px;display:none;max-height:300px;overflow:auto}
.pal.open{display:block}
.pal div{display:flex;gap:12px;align-items:baseline;padding:6px 10px;border-radius:7px;font:500 12px var(--mono);cursor:pointer}
.pal div.on{background:rgba(139,92,246,.2)}
.pal small{color:var(--ink-dim);font:400 12px var(--display)}
.pal .g{display:block;padding:6px 10px 2px;cursor:default}
.qo{position:absolute;left:50%;top:56px;transform:translateX(-50%);z-index:21;width:min(560px,92%);display:none}
.qo.open{display:block}
.qo .pill{border-color:var(--glass-edge);box-shadow:0 0 30px rgba(63,231,255,.18)}
.qo .pal{border-color:var(--glass-edge)}
/* A13 diff line comments */
.diff [data-ln]{cursor:pointer}
.diff [data-ln]:hover{box-shadow:inset 2px 0 0 var(--violet)}
.diff .lc{white-space:normal;display:flex;gap:6px;align-items:center;background:rgba(139,92,246,.1);padding:6px 8px}
.diff .lc input{flex:1;min-width:0;background:rgba(0,0,0,.3);border:1px solid rgba(139,92,246,.5);border-radius:6px;color:var(--ink);font:500 12px var(--display);padding:5px 8px}

    el.innerHTML=`

      <svg width="${W()}" height="${L.height}">

        <linearGradient id="sp${ti}" x1="0" x2="1"><stop offset="0" stop-color="#8B5CF6"/><stop offset=".5" stop-color="#2F7BFF"/><stop offset="1" stop-color="#3FE7FF"/></linearGradient></defs>
        <path class="out" d="${out}" fill="none" stroke="url(#sp${ti})" stroke-width="2.4" stroke-linejoin="round" filter="url(#g${ti})"/>
        <path class="ret" d="${ret}" fill="none" stroke="${col}" stroke-width="1.8" stroke-dasharray="${t.status==='error'?'6 6':'0'}" opacity=".85" filter="url(#g${ti})"/>${L.extra.map(d=>`<path class="out2" d="${d}" fill="none" stroke="url(#sp${ti})" stroke-width="2.4" stroke-linejoin="round" filter="url(#g${ti})"/>`).join('')}${t.handoff?`<path d="M ${lx(t.caller)+86} ${L.shotY} H ${L.pts[0].x}" fill="none" stroke="#B89CFF" stroke-width="1.6" stroke-dasharray="3 6" stroke-linecap="round"/>`:''}
      </svg>`;
    el.appendChild(shot(lx(t.caller||0),L.shotY,'before',t)); el.appendChild(shot(lx(t.caller||0),L.end,'after',t));
    const rl=document.createElement('div'); rl.className='slabel'; rl.style.left=(lx(t.caller||0)+(t.term?96:70))+'px'; rl.style.top=(L.end-14)+'px';
    rl.innerHTML=`<span style="color:${col}">${t.ret}</span>`; el.appendChild(rl);
    let forked=false;
    t.stations.forEach((s,si)=>{
      const p=L.pts[si];

        c.innerHTML=`<svg width="70" height="40" viewBox="-35 -20 70 40">${[...Array(s.coil)].map((_,k)=>`<ellipse cx="${(k-(s.coil-1)/2)*7}" cy="0" rx="9" ry="15" fill="none" stroke="var(--slow)" stroke-width="1.4" opacity="${.35+k*.15}"/>`).join('')}</svg>`; el.appendChild(c); }
      const b=document.createElement('button'); b.className='station'+(s.status?' '+s.status:'')+(s.dot?' '+s.dot:'')+(ti===focus.t&&si===focus.s?' focus':'');
      b.style.left=p.x+'px'; b.style.top=p.y+'px'; b.setAttribute('aria-label',s.cap); b.onclick=()=>{ setFocus(ti,si); dive(); };
      el.appendChild(b);
      const lab=document.createElement('div'); let left, ly=s.ly||0;
      if(s.side) left=s.side==='left';
      else if(P.discovered){ const fromRight=!s.poke&&(si?L.pts[si-1].x:lx(t.caller||0))>p.x+1; left=fromRight||p.x+210>W(); if(left&&!fromRight&&s.ly==null) ly=s.chip?32:22; } // label opposite the incoming line
      else left=s.lane===3;
      lab.className='slabel'+(left?' left':'');
      lab.style.left=(p.x+(left?-18:18))+'px'; lab.style.top=(p.y+ly)+'px';
      lab.innerHTML=`${s.label}${s.coil?` <span style="color:var(--slow)">×${s.coil}</span>`:''}<small>${s.sub} · ${s.ms}ms</small>${s.chip?`<span class="chip${s.chipErr?' error':''}${s.chipCls?' '+s.chipCls:''}">${s.chip}</span>`:''}`;
      el.appendChild(lab);

    });
    feed.appendChild(el);
  });
  feed.appendChild(Object.assign(document.createElement('div'),{style:'height:40vh'}));
  renderMini(); caption(); renderNext(); tele();
}

function setFocus(t,s){

  feed.querySelectorAll('.trip').forEach(e=>{ const on=+e.dataset.t===t; e.classList.toggle('focus',on); e.classList.toggle('recede',!on); });

  const tripEl=feed.querySelector(`.trip[data-t="${t}"]`); tripEl?.querySelectorAll('.station')[s]?.classList.add('focus');

function hl(line){
  const esc=line.replace(/&/g,'&amp;').replace(/</g,'&lt;');
  return esc.replace(/("[^"]*"|'[^']*')|\b(export|async|function|const|return|await|if|import|from|type)\b|\b([a-zA-Z_]\w*)(?=\()|\b(\d+)\b/g,(m,s,k,f,n)=> s?`<span class="st">${s}</span>`:k?`<span class="kw">${k}</span>`:f?`<span class="fn">${f}</span>`:`<span class="nu">${n}</span>`);
}
const codeLines=c=>c.lines.map((l,i)=>{ const n=c.start+i; const live=n===c.live; const inl=c.inline&&c.inline[n];
  return `<div class="ln${live?' live':''}${live&&c.err?' error':''}"><i>${n}</i><span>${hl(l)}</span>${inl?`<span class="inl"><span class="chip${/undefined|✕/.test(inl)?' error':''}">${inl.replace(/</g,'&lt;')}</span></span>`:''}</div>`; }).join('');

function dive(){

  closeDive(); dived=true; stage.classList.add('dived');

  const c=s.code;
  card.innerHTML=`<div class="head"><i class="dot"></i><i class="dot"></i><i class="dot"></i><span class="f">${c.f.toUpperCase()}</span><span class="lbl k">E open in editor · Esc back</span></div>
   <pre>${codeLines(c)}</pre>

  feed.scrollTop=tripEl.offsetTop+p.y-feed.clientHeight*.18;

function closeDive(){ dived=false; stage.classList.remove('dived'); $('#dive')?.remove(); }

function animateTrip(ti,{knit}={}){
  const t=trips[ti], el=feed.querySelector(`.trip[data-t="${ti}"]`); if(!el) return Promise.resolve();
  const out=el.querySelector('path.out'), ret=el.querySelector('path.ret'), stations=[...el.querySelectorAll('.station')];
  const extras=[...el.querySelectorAll('path.out2')].map(p=>[p,p.getTotalLength()]);
  if(reduce){ return Promise.resolve(); }
  if(knit){ out.setAttribute('stroke','var(--ok)'); extras.forEach(([p])=>p.setAttribute('stroke','var(--ok)')); }
  const len=out.getTotalLength(), rl=ret.getTotalLength();
  out.style.strokeDasharray=len; out.style.strokeDashoffset=len; ret.style.opacity=0; stations.forEach(s=>s.classList.add('hidden'));
  extras.forEach(([p,l])=>{ p.style.strokeDasharray=l; p.style.strokeDashoffset=l; });
  const dur=knit?1800:1300, t0=performance.now();
  return new Promise(res=>{
    function step(now){
      const k=Math.min(1,(now-t0)/dur), e=1-Math.pow(1-k,2);
      out.style.strokeDashoffset=len*(1-e);
      extras.forEach(([p,l])=>p.style.strokeDashoffset=l*(1-e));
      const tipY=out.getPointAtLength(len*e).y;
      stations.forEach((s,i)=>{ if(t._L.pts[i].y<=tipY+2) s.classList.remove('hidden'); });
      if(k<1) requestAnimationFrame(step);
      else{
        stations.forEach(s=>s.classList.remove('hidden'));
        const si=t.stations.findIndex(s=>s.snap); if(si>=0) sparks(el,t._L.pts[si]);
        ret.style.strokeDasharray = t.status==='error' ? '6 6' : rl; ret.style.strokeDashoffset = t.status==='error'?0:rl; ret.style.opacity=.85;
        ret.animate([{opacity:0},{opacity:.85}],{duration:500,fill:'forwards'});
        if(t.status!=='error') ret.animate([{strokeDashoffset:rl},{strokeDashoffset:0}],{duration:700,fill:'forwards',easing:'ease-out'});
        if(knit){ out.setAttribute('stroke',`url(#sp${ti})`); extras.forEach(([p])=>p.setAttribute('stroke',`url(#sp${ti})`)); }
        setTimeout(res,520);
      }
    }
    requestAnimationFrame(step);
  });
}
function sparks(el,p){
  for(let i=0;i<22;i++){ const s=document.createElement('i'); s.className='spark'; s.style.left=p.x+'px'; s.style.top=p.y+'px'; el.appendChild(s);
    const a=Math.random()*Math.PI*2, d=18+Math.random()*46;
    s.animate([{transform:'translate(0,0)',opacity:1},{transform:`translate(${Math.cos(a)*d}px,${Math.sin(a)*d}px)`,opacity:0}],{duration:520+Math.random()*300,easing:'cubic-bezier(.16,1,.3,1)'}).onfinish=()=>s.remove(); }
  el.querySelectorAll('.station.error').forEach(st=>st.animate([{boxShadow:'0 0 0 0 rgba(255,59,78,.9)'},{boxShadow:'0 0 0 26px rgba(255,59,78,0)'}],{duration:700}));
}

async function arrive(ti){
  render(); const t=trips[ti]; setFocus(ti,0);
  await animateTrip(ti,{knit:t.title.startsWith('Re-ran')});
  if(t.status==='error'){ const f=firstFail(t); setFocus(ti,f); setTimeout(dive,350); }
  else setFocus(ti,t.stations.length-1);
}

// agent: plans a route (A1), probe walks it, finds the line, proposes a fix, re-knits
async function runAgent(){
  closeAsk(); closeDive();
  let ti=trips.map((t,i)=>t.status==='error'?i:-1).filter(i=>i>=0).pop(); if(ti==null) return;
  const A=P.agent, t=trips[ti]; setFocus(ti,0); const el=feed.querySelector(`.trip[data-t="${ti}"]`);
  const target=t.stations.findIndex(s=>s.label===A.target), steps=[...Array(target+1).keys()].filter(i=>!t.stations[i].branch);
  agentState="planning"; tele(); agentStat(0,`${A.skill} playbook`); sd('understand');
  const plan=document.createElementNS(NS,'path'); plan.setAttribute('class','plan');
  plan.setAttribute('d','M '+steps.map(i=>`${t._L.pts[i].x} ${t._L.pts[i].y}`).join(' L ')); el.querySelector('svg').appendChild(plan);
  $('#cap').textContent=`Plan: check ${steps.map(i=>t.stations[i].label).join(', ')}.`;
  await wait(reduce?0:1300);
  agentStat(1,`${A.skill} playbook`);
  const probe=document.createElement('i'); probe.className='probe'; el.appendChild(probe);
  for(const [k,i] of steps.entries()){ const p=t._L.pts[i]; probe.style.left=p.x+'px'; probe.style.top=p.y+'px'; setFocus(ti,i); el.appendChild(probe);
    agentState=`checking ${k+1}/${steps.length}`; tele();
    $('#cap').textContent = k===0?'Your agent is retracing your click…': i<target?`Checking ${t.stations[i].label}…`:'Found it.';
    await wait(reduce?0:520);
    if(i<target){ const tk=document.createElement('span'); tk.className='tick'; tk.textContent='✓'; tk.style.left=p.x+'px'; tk.style.top=p.y+'px'; el.appendChild(tk); } }
  plan.remove(); agentStat(2,`${A.skill} playbook`); agentState="waiting for you"; tele();
  const p=t._L.pts[target]; const f=document.createElement('div'); f.className='found'; f.style.left=p.x+'px'; f.style.top=p.y+'px'; f.innerHTML='<i></i><i></i><i></i><i></i><span>FOUND IT</span>'; el.appendChild(f);
  const card=document.createElement('div'); card.className='agentcard'; card.style.left=Math.max(14,Math.min(p.x-180,feed.clientWidth-440))+'px'; card.style.top=(el.offsetTop+p.y+44)+'px';
  card.innerHTML=`<div class="h"><span style="color:var(--violet)">✦</span><b>Found it</b><span class="conf">OBSERVED</span><span class="skill lit" title="The playbook the agent used">${A.skill}</span><span class="lbl" style="margin-left:auto">${A.file}</span></div>
    <p>${A.text}</p>
    <div class="diff" id="adiff">${diffHtml(A.diff)}</div>
    <div class="row" style="align-items:center"><button class="btn on" id="apply">Apply fix ⌘↵</button><button class="btn" id="reject">Not now</button><button class="btn quiet" id="toIssue" style="margin-left:auto">Copy as issue</button></div>`;
  feed.appendChild(card); $('#apply').focus(); sdFound(card);
  bindDiff(card,A);
  const clean=()=>{ card.remove(); f.remove(); probe.remove(); el.querySelectorAll('.tick').forEach(x=>x.remove()); agentStat(-1); agentState="idle"; tele(); };
  $('#toIssue').onclick=()=>showIssue();
  $('#reject').onclick=clean;
  $('#apply').onclick=async()=>{ clean(); agentState="re-running"; tele(); sd('fix');
    t.stations[target].pin=A.memo;
    $('#cap').textContent=`Applied. Re-running "${A.again}" to check…`;
    await ghostClick(A.button);
    const fixed=A.fixed(); fixed.cp={n:trips.filter(x=>x.cp).length+1,title:A.target+' fix',diff:currentDiff||A.diff}; trips.push(fixed); A.after();
    P.usage=Math.min(.95,(P.usage||0)+.14); P.tokens=P.tokens||"28k of 200k"; P.cost=P.cost||"$0.11"; setFuel();
    agentState="idle"; await arrive(trips.length-1); $('#cap').textContent=A.done; sd('proved'); };
}
const wait=ms=>new Promise(r=>setTimeout(r,ms));

// A13 line comments on the diff
let currentDiff=null;
const diffHtml=d=>d.map(([k,l],i)=>`<div class="${k}" data-ln="${i}" title="Comment on this line">${l.replace(/</g,'&lt;')}</div>`).join('');
function bindDiff(card,A){
  currentDiff=null;
  card.querySelector('#adiff').onclick=e=>{
    const ln=e.target.closest('[data-ln]'); if(!ln||card.querySelector('.lc')) return;
    ln.insertAdjacentHTML('afterend',`<div class="lc"><input placeholder="${A.revise.hint}" aria-label="Comment"><button class="btn">Send to agent</button></div>`);
    const box=card.querySelector('.lc'), inp=box.querySelector('input'); inp.focus();
    inp.onkeydown=ev=>{ ev.stopPropagation(); if(ev.key==='Enter') box.querySelector('button').click(); if(ev.key==='Escape') box.remove(); };
    box.querySelector('button').onclick=async()=>{ const note=inp.value||A.revise.hint;
      box.outerHTML=`<div class="note">You: ${note.replace(/</g,'&lt;')}</div>`; $('#cap').textContent='Your agent is revising the fix with your comment…';
      await wait(reduce?0:900); currentDiff=A.revise.diff;
      card.querySelector('#adiff').innerHTML=`<div class="note">You: ${note.replace(/</g,'&lt;')}</div>`+diffHtml(currentDiff); $('#cap').textContent='Revised. Apply it, or comment again.'; };
  };
}

// O2 ghost cursor: the agent clicks in your app
async function ghostClick(sel){
  const g=$('#ghost'), dock=$('.dock'), target=$(sel); if(!target||reduce||getComputedStyle(dock).display==='none') return wait(reduce?0:600);
  const dr=dock.getBoundingClientRect(), tr=target.getBoundingClientRect();
  g.style.transition='none'; g.style.left=dr.width*.5+'px'; g.style.top=dr.height*.8+'px'; g.style.display='block'; void g.offsetWidth; g.style.transition='';
  g.style.left=(tr.left-dr.left+tr.width*.5)+'px'; g.style.top=(tr.top-dr.top+tr.height*.55)+'px';
  await wait(800);
  g.querySelector('i').animate([{opacity:1,transform:'scale(.4)'},{opacity:0,transform:'scale(1.6)'}],{duration:450});
  target.animate([{filter:'brightness(1.3)'},{filter:'none'}],{duration:300});
  await wait(500); g.style.display='none';
}

// O6 issue card
function showIssue(){
  $('#issue')?.remove(); const I=P.issue, A=P.agent, d=currentDiff||A.diff;
  const md=`## ${I.title}\n\n${I.summary}\n\n### Steps\n${I.steps.map((x,i)=>`${i+1}. ${x}`).join('\n')}\n\n### Where it broke\n\`${I.line}\`\n\n### Fix\n\`\`\`diff\n${d.map(x=>x[1]).join('\n')}\n\`\`\`\n\nClip: .shrike/clips/${I.clip}`;
  const s=document.createElement('div'); s.className='sheet'; s.id='issue'; s.style.left='50%'; s.style.top='60px'; s.style.marginLeft='-260px';
  s.innerHTML=`<span class="lbl">Issue · GitHub or Linear</span><h4>${I.title}</h4><p>${I.summary}</p><ol>${I.steps.map(x=>`<li>${x.replace(/</g,'&lt;')}</li>`).join('')}</ol>
    <p>Where it broke: <code>${I.line}</code></p><div class="diff">${diffHtml(d)}</div>
    <p>Clip saved next to it: <code style="color:var(--ink)">.shrike/clips/${I.clip}</code></p>
    <div class="row"><button class="btn on" id="copyIssue">Copy issue</button><button class="btn" id="issueClose">Close</button></div>`;
  stage.appendChild(s); $('#copyIssue').focus();
  $('#issueClose').onclick=()=>s.remove();
  $('#copyIssue').onclick=async e=>{ try{ await navigator.clipboard.writeText(md); e.target.textContent='Copied'; }catch{ e.target.textContent='Copy blocked here'; } };
}

const CMDS=[["/explain","Say what happened here in plain words"],["/fix","Find the cause and propose a fix"],["/replay","Play this trip again"],["/compare","Before and after a fix, side by side"],["/record","Save this trip as a clip"],["/time","Switch to real time spacing"],["/issue","Copy a GitHub or Linear issue"]];

function closeAsk(){ $('#ask').classList.remove('open'); $('#askCtx').style.display='none'; $('#pal').classList.remove('open'); }
function pal(){ const v=$('#askIn').value; const on=v.startsWith('/'); const list=[...CMDS,...sdCmds()].filter(c=>c[0].startsWith(v.split(' ')[0]));
  $('#pal').classList.toggle('open',on&&list.length>0); palSel=Math.min(palSel,Math.max(0,list.length-1));

  $('#pal').querySelectorAll('[data-c]').forEach(d=>d.onclick=()=>slash(d.dataset.c)); return list; }
function slash(c){
  closeAsk(); const t=trips[focus.t]; if(sdSlash(c)) return;
  if(c==='/fix') return runAgent();
  if(c==='/replay'){ closeDive(); return animateTrip(focus.t); }
  if(c==='/time') return $('#bTime').click();
  if(c==='/issue') return showIssue();

  if(c==='/compare') return void ($('#cap').textContent=trips.some(x=>x.rerun)?'Compare: the re-run goes all the way and back in green; the broken one snapped. Same lanes, so the shapes line up.':'Nothing to compare yet. Fix it first, then /compare shows before and after.');
  if(c==='/record'){ $('#cap').textContent=`Recording "${t.title}" as a clip…`; setTimeout(()=>$('#cap').textContent=`Saved .shrike/clips/${P.issue.clip}`,reduce?0:900); }
}

// ---- O5 quick open ----
let qoSel=0, qoRows=[];
function qoItems(){
  const files=new Map(), out=[];
  trips.forEach(t=>t.stations.forEach(s=>{ if(s.code&&!files.has(s.code.f)) files.set(s.code.f,s); }));
  files.forEach((s,f)=>out.push({g:'Files',label:f,run:()=>openFile(s)}));
  trips.forEach((t,i)=>out.push({g:'Trips',label:t.title,run:()=>setFocus(i,t.status==='error'?firstFail(t):0)}));
  const seen=new Set(), routes=[], logs=[]; trips.forEach((t,i)=>[{label:t.title},...t.stations].forEach((s,k)=>{ const si=Math.max(0,k-1), m=s.label.match(/\b(GET|POST|PATCH|PUT|DELETE) (\/\S*)/); if(m&&!seen.has(m[0])){ seen.add(m[0]); routes.push({g:'Routes',label:m[0],run:()=>setFocus(i,si)}); }
    if(/^log /.test(s.label)) logs.push({g:'Logs',label:s.label.slice(4),run:()=>setFocus(i,si)}); }));
  return out.concat(routes,logs);
}
function openQo(){ closeAsk(); $('#qo').classList.add('open'); $('#qoIn').value=''; qoSel=0; qoRender(); $('#qoIn').focus(); }
function closeQo(){ $('#qo').classList.remove('open'); }
function qoRender(){
  const q=$('#qoIn').value.toLowerCase(); qoRows=qoItems().filter(r=>r.label.toLowerCase().includes(q)).slice(0,12); let g='';
  $('#qoList').innerHTML=qoRows.map((r,i)=>{ const h=r.g!==g?`<span class="lbl g">${g=r.g}</span>`:''; return `${h}<div role="option" class="${i===qoSel?'on':''}" data-i="${i}">${r.label.replace(/</g,'&lt;')}</div>`; }).join('')||'<span class="lbl g">Nothing matches</span>';
  $('#qoList').querySelectorAll('[data-i]').forEach(d=>d.onclick=()=>{ closeQo(); qoRows[+d.dataset.i].run(); });
}
$('#qoIn').addEventListener('input',()=>{ qoSel=0; qoRender(); });
$('#qoIn').addEventListener('keydown',e=>{ e.stopPropagation();
  if(e.key==='Escape') closeQo();
  else if(e.key==='ArrowDown'||e.key==='ArrowUp'){ e.preventDefault(); qoSel=(qoSel+(e.key==='ArrowDown'?1:-1)+qoRows.length)%Math.max(1,qoRows.length); qoRender(); }
  else if(e.key==='Enter'&&qoRows[qoSel]){ closeQo(); qoRows[qoSel].run(); } });

document.addEventListener('keydown',e=>{
  if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='p'){ e.preventDefault(); return openQo(); }
  if(e.target.matches('input,textarea')) return;
  const t=trips[focus.t];
  if(e.key==='ArrowDown'){ e.preventDefault(); if(focus.s<t.stations.length-1) setFocus(focus.t,focus.s+1); else if(focus.t<trips.length-1) setFocus(focus.t+1,0); }
  else if(e.key==='ArrowUp'){ e.preventDefault(); if(focus.s>0) setFocus(focus.t,focus.s-1); else if(focus.t>0) setFocus(focus.t-1,trips[focus.t-1].stations.length-1); }
  else if(e.key==='Enter'){ if(e.target.matches('button')) return; e.preventDefault(); dive(); }
  else if(e.key==='Escape'&&sdClose()){}
  else if(!e.metaKey&&!e.ctrlKey&&(e.key==='k'||e.key==='K')){ skillShelf(); }
  else if(!e.metaKey&&!e.ctrlKey&&(e.key==='f'||e.key==='F')){ flowShelf(); }
  else if(e.key==='l'||e.key==='L'){ storyToggle(); }
  else if(e.key==='Escape'){ if(pointing) setPoint(false); else if($('#menu').classList.contains('open')) toggleMenu(false); else if($('#issue')||$('#cpop')){ $('#issue')?.remove(); $('#cpop')?.remove(); } else if(dived) closeDive(); }
  else if(e.key==='t'||e.key==='T'){ $('#bTime').click(); }
  else if(e.key==='x'||e.key==='X'){ setPoint(!pointing); }
  else if(e.key==='i'||e.key==='I'){ showIssue(); }
  else if(e.key==='!'){ const nxt=trips.findIndex((x,i)=>i>focus.t && x.status==='error'); const ti=nxt>=0?nxt:trips.findIndex(x=>x.status==='error'); if(ti>=0) setFocus(ti,firstFail(trips[ti])); }
  else if(e.key===' '){ if(e.target.matches('button')) return; e.preventDefault(); closeDive(); animateTrip(focus.t); }
  else if((e.metaKey||e.ctrlKey)&&e.key.toLowerCase()==='k'){ e.preventDefault(); $('#bAsk').click(); }
});

// S3: a live checklist in the caption area. Steps are [label, result, state?]
async function checklist(title,steps){
  const m=$('#moves'), st=steps.map(()=>'wait'), I={wait:'○',run:'•',ok:'✓',warn:'!',fail:'✕'};
  const draw=()=>{ m.innerHTML=`<div class="runlist" role="list" aria-label="${esc(title)}"><span class="lbl" style="margin-bottom:4px">${esc(title)}</span>${steps.map((s,i)=>`<div class="s ${st[i]}" role="listitem"><b>${I[st[i]]}</b><span>${esc(s[0])}${/ok|warn|fail/.test(st[i])&&s[1]?` <span style="color:var(--ink-faint)">· ${esc(s[1])}</span>`:''}</span></div>`).join('')}</div>`; m.classList.add('on'); placeMoves(); };
  for(let i=0;i<steps.length;i++){ st[i]='run'; draw(); await wait(reduce?0:650); st[i]=steps[i][2]||'ok'; draw(); }
  await wait(reduce?0:300); return m.innerHTML;
}

async function runSkill(k){
  sdClose(true); k.uses=(k.uses||0)+1;
  const steps=(k.steps||["Read the skill (read-only, ~/.claude/skills)","Follow its steps in this project","Report what it did"]).map(x=>[x]);
  if(k.id==='start-todo-app'&&!k.learned) steps[2]=['Start the page on :5173','5173 was taken, used 5174','warn'];
  $('#cap').textContent=`Running the ${k.id} skill…`;
  const html=await checklist(`Skill · ${k.id}${k.v?' v'+k.v:''}`,steps);
  if(k.id==='start-todo-app'&&!k.learned){ moves([],`${k.id} finished. It learned something on the way.`,html); proposal(k); }
  else moves([['Done',()=>moves([]),true]],`${k.id} finished.`,html);
}
function proposal(k){
  const s=sheet('prop',`<span class="lbl">This skill can improve · ${k.id} v${k.v}</span><h4>Learned: port 5173 is often taken, check it first</h4>
    <div class="diff">${diffHtml([["d","-  3. Start the page on :5173"],["a","+  3. Check :5173 is free; if not, use the next free port"],["a","+  4. Start the page on that port"]])}</div>
    <div class="row"><button class="btn on" id="pKeep">Keep this improvement</button><button class="btn" id="pDrop">Discard</button></div>`,520);
  $('#pKeep').onclick=()=>{ s.remove(); k.learned=true; k.v++; k.imp='just now'; k.hist=`v${k.v}: checks the port first`; k.steps.splice(2,1,'Check :5173 is free; if not, use the next free port','Start the page on that port');
    moves([],`${k.id} is now v${k.v}. You can see the change in its card on the shelf.`); };
  $('#pDrop').onclick=()=>{ s.remove(); moves([],'Discarded. The skill stays as it was.'); };
}

// B1 record, B2 flows shelf
function flowShelf(){
  const s=sheet('flows',`<span class="lbl">Flows · F</span><h4>Clicks Shrike can replay for you</h4>${SD.watching?`<p>Watching "Add a todo" and "Tick a todo" ${SD.watching}.</p>`:''}
    <div class="shelf">${FLOWS.map((f,i)=>`<div class="scard"><b style="font-family:var(--display);font-size:13px">${esc(f.name)}</b><small>${f.steps.map(esc).join(' → ')}</small>
      <span class="meta"><span class="sdot ${f.ok?'ok':'fail'}"></span><span>last run ${f.ok?'green':'red'}</span>${f.watch?`<span style="color:var(--cyan)">${glyph('eye')} watching</span>`:''}</span>
      <div class="row"><button class="btn" data-fr="${i}">Run</button></div></div>`).join('')}</div>
    <div class="row" style="margin-top:10px"><button class="btn on" id="flRec"><span style="color:var(--fail)">●</span> Record a flow</button><button class="btn" data-close>Close</button></div>`,620);
  s.querySelectorAll('[data-fr]').forEach(b=>b.onclick=()=>runFlow(FLOWS[+b.dataset.fr]));
  $('#flRec').onclick=()=>{ s.remove(); recStart(); };
}
async function runFlow(f){
  sdClose(true); $('#cap').textContent=`Replaying "${f.name}"…`;
  if(f.btn) await ghostClick(f.btn);
  const T=PROJECTS['todo-app'].trips, base=f.name==='Add a todo'?addTodoTrip(SD.fixed):{...T[f.name==='Tick a todo'?1:0]};
  base.stations=base.stations.map(x=>({...x})); f.ok=base.status!=='error';
  if(f.name==='Add a todo'&&!SD.fixed) $('#mErr').textContent='Something went wrong';
  trips.push(base); await arrive(trips.length-1);
}
function recStart(){
  SD.rec=[]; $('#rec').classList.add('on'); $('#mock').classList.add('recording'); recDraw();
}
function recDraw(){
  $('#recTxt').textContent=`REC ${SD.rec.length}`; $('#rec').title=`Recording · ${SD.rec.length} steps`;
  moves([['Stop recording',recStop,true]],'Recording. Click through your app; Shrike writes down each step.',
    SD.rec.length?`<div class="runlist"><span class="lbl" style="margin-bottom:4px">Recording</span>${SD.rec.map(x=>`<div class="s ok"><b>✓</b><span>${esc(x)}</span></div>`).join('')}</div>`:'');
}
$('#mock').addEventListener('click',e=>{ if(!SD.rec||pointing) return; const el=e.target.closest('button,input,li'); if(!el) return;
  SD.rec.push(el.tagName==='INPUT'?`Type in "${el.getAttribute('aria-label')||'a field'}"`:`Click "${((el.tagName==='LI'?el.firstChild:el).textContent||'').trim().slice(0,28)}"`); recDraw(); },true);
function recStop(){
  const steps=SD.rec; SD.rec=null; $('#rec').classList.remove('on'); $('#mock').classList.remove('recording'); moves([]);
  if(!steps.length) return void ($('#cap').textContent='Nothing recorded.');
  const s=sheet('recname',`<span class="lbl">Save this flow</span><h4>${steps.length} steps recorded</h4><ol>${steps.map(x=>`<li>${esc(x)}</li>`).join('')}</ol>
    <label class="lbl" for="rnN">Name</label><input class="sin" id="rnN" value="Add then tick" style="margin:4px 0 10px"><div class="row"><button class="btn on" id="rnGo">Save flow</button><button class="btn" data-close>Discard</button></div>`,440);
  $('#rnGo').onclick=()=>{ FLOWS.push({name:$('#rnN').value||'New flow',steps,ok:true}); s.remove(); $('#cap').textContent=`Saved "${FLOWS.at(-1).name}". It's on your flows shelf (F).`; };
}
if(location.hash==='#sdlc') setTimeout(()=>storyToggle(true),2400);


P.bind(); setFuel();
render();
setTimeout(()=>arrive(trips.length-1),300);
})();
</script>
