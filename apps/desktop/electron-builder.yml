# macOS arm64 .dmg. Run through scripts/release/build-mac.sh, which builds a staging folder (out/, production node_modules,
# extra/ mirroring the repo layout that src/main/paths.ts reads under Resources) and points electron-builder at it.
appId: dev.shrike.app
productName: Shrike
copyright: Copyright (c) 2026 Sumant Tirkey
files:
  - out/**
  - resources/icon.png
  - package.json
  - node_modules/**
asarUnpack:
  - node_modules/node-llama-cpp/**
  - node_modules/@node-llama-cpp/**
extraResources:
  - from: extra
    to: .
    filter: ["**/*"]
npmRebuild: false
mac:
  target: [{ target: dmg, arch: [arm64] }]
  category: public.app-category.developer-tools
  icon: resources/icon.png
  identity: "Sumant Tirkey (ZK8UX8XUW9)"
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: resources/entitlements.mac.plist
  entitlementsInherit: resources/entitlements.mac.plist
  notarize: false
  # Signed by scripts/release/build-mac.sh with its own entitlements (microphone only); re-signing here would drop them.
  signIgnore: ["ShrikeVoice\\.app"]
  extendInfo:
    NSMicrophoneUsageDescription: Shrike listens while you hold Option Space or turn on hands-free, so you can drive it by voice. Audio stays on this Mac.
dmg:
  artifactName: Shrike-${version}-arm64.${ext}
# Linux (scripts/release/build-linux.sh): no voice, no signing. node-llama-cpp's Linux CPU build comes from npm; the planner turns itself off if it can't load.
linux:
  target:
    - { target: AppImage, arch: [x64, arm64] }
    - { target: deb, arch: [x64, arm64] }
  category: Development
  icon: resources/icon.png
  maintainer: Sumant Tirkey <st72365@gmail.com>
  synopsis: The Agentic Debugging Environment
appImage:
  artifactName: Shrike-${version}-${arch}.${ext}
deb:
  artifactName: Shrike-${version}-${arch}.${ext}
# Windows: not built or tested yet (docs/14-compatibility.md). Unsigned NSIS installer.
win:
  target: [{ target: nsis, arch: [x64] }]
  icon: resources/icon.png
nsis:
  artifactName: Shrike-${version}-x64-setup.${ext}
